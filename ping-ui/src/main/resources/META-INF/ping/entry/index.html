<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="ping-renderer" content="../assets/renderer" />
    <title>Ping Admin - @ping.module@</title>
  </head>
  <body>
    <main id="ping-root" style="max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #374151;">
      <h1 style="font-size: 1.5rem; margin: 0 0 0.5rem;">渲染器重建中</h1>
      <p style="line-height: 1.8; color: #6b7280;">
        Ping UI Web SDK 已就绪，后台管理渲染器（侧栏 / 路由 / 菜单）将在后续变更中
        以 SDK 处理器重建。当前页面为占位页。
      </p>
      <p style="line-height: 1.8; color: #6b7280;">
        SDK 演示：<a href="/ui/demo/index.html">/ui/demo/index.html</a>
      </p>
    </main>
    <script type="module">
      import { createPingUi } from "../assets/renderer/renderer.js?v=@project.version@-@maven.build.timestamp@"
      // 加载 SDK bundle 并初始化，验证产物可运行
      const sdk = createPingUi({ namespace: "@ping.module@", debug: true })
      sdk.init()
      sdk.destroy()
    </script>
  </body>
</html>
