schema: spec-driven

# 项目上下文（可选）
# 只添加应当约束 OpenSpec 产出物和工作流的要求。
# 包含 AI 无法通过阅读代码推断出的约束。
# 不要放通用的项目文档和可从代码中发现的事实。
# 示例：
#   context: |
#     设计和任务必须覆盖 Windows、macOS 和 Linux
#     所有产出物使用中文撰写

# 按产出物的规则（可选）
# 为特定产出物添加自定义规则。
# 示例：
#   rules:
#     proposal:
#       - 提案保持在 500 字以内
#       - 始终说明范围之外的内容
#     tasks:
#       - 将任务拆分为每次不超过 2 小时的工作块
rules:
  design:
    - design.md 只承载架构决策（取舍理由、被否决的备选方案、跨阶段约束与不变量）；实现级细节（字段表、示例文件、边界用例、接口契约、降级行为契约）写入 design/phase-<N>-<kebab-name>.md
    - 阶段设计文档与 tasks.md 的阶段编号一一对应，命名遵循 design/phase-<N>-<kebab-name>.md
    - 阶段设计文档只承载"是什么"与"怎么验"，不重复陈述决策理由；架构决策变更时回写 design.md 对应的 D 条目，阶段文档改为引用
    - 每个阶段设计文档包含：对应任务范围概述、逐任务实现细节、边界与降级契约、验证方式
    - design.md 头部维护阶段设计文档索引表，标注各阶段文档的细化状态

# 按操作的指南（可选）
# 为 apply 和 archive 操作添加咨询性指南。
# 此段落独立于上述的产出物规则。
# 示例：
#   operations:
#     apply:
#       guidance:
#         - 测试摘要保持简洁
#     archive:
#       guidance:
#         - 完成前总结归档结果
